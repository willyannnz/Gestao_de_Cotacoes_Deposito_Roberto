{% extends "base.html" %}
{% block content %}
<h2>Produtos</h2>
<form method="post" class="row g-2 mb-4">
    <div class="col-auto">
        <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
    </div>
    <div class="col-auto">
        <input type="text" name="unidade" class="form-control" placeholder="Unidade (ex: 1cx)">
    </div>
    <div class="col-auto">
        <button class="btn btn-primary">Adicionar</button>
    </div>
</form>
<ul class="list-group">
    {% for p in produtos %}
    <li class="list-group-item">{{ p.nome }} <span class="text-muted">{{ p.unidade or "" }}</span></li>
    {% else %}
    <li class="list-group-item text-muted">Nenhum produto cadastrado ainda.</li>
    {% endfor %}
</ul>
{% endblock %}
