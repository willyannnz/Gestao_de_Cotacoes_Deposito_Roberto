{% extends "base.html" %}
{% block content %}
<h2>Produtos</h2>
<form method="post" class="row g-2 mb-4">
    <div class="col-auto">
        <input type="text" name="nome" class="form-control" placeholder="Nome do produto" required>
    </div>
    <div class="col-auto">
        <input type="text" name="unidade" class="form-control" placeholder="Unidade (ex: 1cx)">
    </div>
    <div class="col-auto">
        <button class="btn btn-primary">Adicionar</button>
    </div>
</form>
<ul class="list-group">
    {% for p in produtos %}
    <li class="list-group-item">
        <div class="d-flex justify-content-between align-items-center gap-2">
            <span>{{ p.nome }} <span class="text-muted">{{ p.unidade or "" }}</span></span>
            <div class="d-flex align-items-center gap-2">
                <details>
                    <summary class="btn btn-outline-secondary btn-sm">Editar</summary>
                    <form method="post" action="{{ url_for('main.editar_produto', produto_id=p.id) }}" class="d-flex gap-2 mt-2">
                        <input type="text" name="nome" class="form-control form-control-sm" value="{{ p.nome }}" required>
                        <input type="text" name="unidade" class="form-control form-control-sm" value="{{ p.unidade or '' }}" placeholder="unidade">
                        <button class="btn btn-primary btn-sm">Salvar</button>
                    </form>
                </details>
                <form method="post" action="{{ url_for('main.excluir_produto', produto_id=p.id) }}" onsubmit="return confirm('Excluir esse produto do cadastro?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Remover</button>
                </form>
            </div>
        </div>
    </li>
    {% else %}
    <li class="list-group-item text-muted">Nenhum produto cadastrado ainda.</li>
    {% endfor %}
</ul>
{% endblock %}
