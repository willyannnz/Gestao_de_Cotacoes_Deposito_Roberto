{% extends "base.html" %}
{% block content %}
<h2>Lista de Produtos — {{ mes }}</h2>

{% if tem_lista_anterior %}
<form method="post" class="mb-3">
    <input type="hidden" name="acao" value="copiar_anterior">
    <button type="submit" class="btn btn-outline-secondary btn-sm">Copiar lista de {{ mes_anterior }}</button>
</form>
{% endif %}

<form method="post">
    <ul class="list-group mb-3">
        {% for p in produtos %}
        <li class="list-group-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="produto_id" value="{{ p.id }}" id="p{{ p.id }}"
                    {{ "checked" if p.id in selecionados_ids else "" }}>
                <label class="form-check-label" for="p{{ p.id }}">{{ p.nome }} <span class="text-muted">{{ p.unidade or "" }}</span></label>
            </div>
        </li>
        {% else %}
        <li class="list-group-item text-muted">Cadastra produtos primeiro na tela de Produtos.</li>
        {% endfor %}
    </ul>
    <button type="submit" class="btn btn-primary">Salvar lista do mês</button>
</form>
{% endblock %}
