{% extends "base.html" %}
{% block content %}
<h2>Consolidado — {{ mes }}</h2>
<table class="table table-striped">
    <thead>
        <tr><th>Produto</th><th>Fornecedor vencedor</th><th>Preço</th></tr>
    </thead>
    <tbody>
        {% for v in vencedoras %}
        <tr>
            <td>{{ v.produto }}</td>
            <td>{{ v.fornecedor_vencedor }}</td>
            <td>R$ {{ "%.2f"|format(v.preco) }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-muted">Nenhuma cotação registrada pra esse mês ainda.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
