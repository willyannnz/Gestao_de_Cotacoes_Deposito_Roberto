<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Cotação — Depósito do Roberto</title>
    <meta name="theme-color" content="#2A1D17">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="app-shell">
    <button class="sidebar-toggle d-lg-none" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Abrir menu">
        ☰
    </button>

    <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="{{ url_for('main.index') }}">
            <img src="{{ url_for('static', filename='logo_deposito_claro.png') }}" alt="" class="sidebar-logo">
            <span>Cotações - Depósito</span>
        </a>
        <nav class="sidebar-nav">
            <a class="sidebar-link {{ 'active' if request.endpoint == 'main.index' else '' }}" href="{{ url_for('main.index') }}">
                <span class="sidebar-icon"><i class="fa-solid fa-house"></i></span> Início
            </a>
            <a class="sidebar-link {{ 'active' if request.endpoint == 'main.lista_meses' else '' }}" href="{{ url_for('main.lista_meses') }}">
                <span class="sidebar-icon"><i class="fa-solid fa-table"></i></span> Tabelas Mensais
            </a>
            <a class="sidebar-link {{ 'active' if request.endpoint == 'main.registrar_cotacao' else '' }}" href="{{ url_for('main.registrar_cotacao', mes=mes_atual_sidebar) }}">
                <span class="sidebar-icon"><i class="fa-solid fa-tags"></i></span> Registrar preços
            </a>
            <a class="sidebar-link {{ 'active' if request.endpoint == 'main.listar_produtos' else '' }}" href="{{ url_for('main.listar_produtos') }}">
                <span class="sidebar-icon"><i class="fa-solid fa-box-archive"></i></span> Produtos
            </a>
            <a class="sidebar-link {{ 'active' if request.endpoint == 'main.listar_fornecedores' else '' }}" href="{{ url_for('main.listar_fornecedores') }}">
                <span class="sidebar-icon"><i class="fa-solid fa-truck"></i></span> Fornecedores
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="container-fluid py-4 px-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'warning' if category == 'warning' else 'success' }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll(".alert-success").forEach((el) => {
    window.setTimeout(() => {
        el.style.transition = "opacity 0.4s ease";
        el.style.opacity = "0";
        window.setTimeout(() => el.remove(), 400);
    }, 3000);
});
</script>
</body>
</html>
