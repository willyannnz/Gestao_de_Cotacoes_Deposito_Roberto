<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Cotação — Depósito do Roberto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">Cotação - Depósito</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('main.listar_fornecedores') }}">Fornecedores</a>
            <a class="nav-link" href="{{ url_for('main.listar_produtos') }}">Produtos</a>
            <a class="nav-link" href="{{ url_for('main.registrar_cotacao') }}">Registrar Cotação</a>
            <a class="nav-link" href="{{ url_for('main.consolidado', mes=mes_atual_nav) }}">Consolidado</a>
            <a class="nav-link" href="{{ url_for('main.todas_cotacoes', mes=mes_atual_nav) }}">Todas as Cotações</a>
            <a class="nav-link" href="{{ url_for('main.pedido_por_fornecedor', mes=mes_atual_nav) }}">Pedido de Compra</a>
            <a class="nav-link" href="{{ url_for('main.lista_mes', mes=mes_atual_nav) }}">Lista do Mês</a>
        </div>
    </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'warning' if category == 'warning' else 'success' }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
